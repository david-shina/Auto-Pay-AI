[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Placeholder only. `migrations/env.py` overrides this with the
# DATABASE_URL from the application settings, so no credential belongs
# in this file.
sqlalchemy.url = postgresql://localhost/autopay

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
