name: auto-pay-ai-test

services:
  db-test:
    image: postgres:16-alpine
    container_name: autopay-db-test
    environment:
      POSTGRES_USER: autopay_test
      POSTGRES_PASSWORD: autopay_test
      POSTGRES_DB: autopay_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopay_test -d autopay_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autopay-test-net

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The test image needs pytest & friends.
        EXTRAS: dev
    container_name: autopay-app-test
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autopay_test:autopay_test@db-test:5432/autopay_test
      TEST_DATABASE_URL: postgresql://autopay_test:autopay_test@db-test:5432/autopay_test
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      SCHEDULER_ENABLED: "false"
    depends_on:
      db-test:
        condition: service_healthy
    # The entrypoint applies the migrations before handing over, so the
    # command only has to run the suite.
    command: ["pytest", "--cov=app", "--cov-report=term-missing"]
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      - ./migrations:/code/migrations
      - ./alembic.ini:/code/alembic.ini
      - ./schema.sql:/code/schema.sql
    networks:
      - autopay-test-net

networks:
  autopay-test-net:
    driver: bridge
